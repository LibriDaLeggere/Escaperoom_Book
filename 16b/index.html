<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>16.2 — 16ª Ora</title>
<style>
  :root{
    --notte:#15243a; --notte-cupa:#101b2c;
    --ottone:#d2a444; --ottone-scuro:#8d6a22;
    --carta:#f4ead6; --carta-tenue:#cdbfa6;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  body{
    margin:0;
    background:var(--notte);
    background-image:radial-gradient(ellipse at 50% -10%, #1e3251 0%, var(--notte) 55%, var(--notte-cupa) 100%);
    color:var(--carta);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  main{max-width:32rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}
  .targhetta{
    display:inline-block;
    padding:.5rem 1.15rem .6rem;
    border-radius:.3rem;
    background:linear-gradient(160deg,#e8c169 0%,var(--ottone) 45%,#a97f2c 100%);
    color:#3a2a08;
    font-size:1.5rem; font-weight:700; letter-spacing:.03em;
    box-shadow:0 2px 5px rgba(0,0,0,.45);
    position:relative;
  }
  .targhetta::before{
    content:""; position:absolute; top:.26rem; left:50%;
    transform:translateX(-50%);
    width:.3rem;height:.3rem;border-radius:50%;
    background:#3a2a08;opacity:.5;
  }
  .appendino{
    width:1px;height:1.6rem;margin:0 auto;
    background:linear-gradient(to bottom, rgba(244,234,214,.05), rgba(244,234,214,.35));
  }
  header{text-align:center;margin-bottom:2.5rem}
  .sala{margin:1.4rem 0 .35rem;color:var(--carta-tenue);font-size:.95rem}
  .quale{margin:.4rem 0 0;color:var(--carta-tenue);font-size:.95rem}
  h1{font-size:1.45rem;font-weight:600;line-height:1.3;margin:0}
  button{
    width:100%;font-family:inherit;font-size:1.05rem;
    padding:1rem 1.1rem;background:transparent;color:var(--ottone);
    border:1.5px solid var(--ottone-scuro);border-radius:.4rem;cursor:pointer;
  }
  button:hover{background:rgba(210,164,68,.08)}
  button:focus-visible{outline:3px solid var(--ottone);outline-offset:2px}
  #aiuto{
    background:rgba(244,234,214,.06);
    border-left:3px solid var(--ottone);
    border-radius:.15rem .4rem .4rem .15rem;
    padding:1.15rem 1.25rem;
    animation:entra .35s ease-out;
  }
  #aiuto p{margin:0;font-size:1.08rem}
  @keyframes entra{from{opacity:0;transform:translateY(-.4rem)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){#aiuto{animation:none}}
  .chiusura{
    margin-top:3rem;padding-top:1.25rem;
    border-top:1px solid rgba(244,234,214,.15);
    font-size:.9rem;color:var(--carta-tenue);text-align:center;
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="appendino"></div>
    <span class="targhetta">16.2</span>
    <p class="sala">16ª Ora</p>
    <h1>Quello che manca</h1>
    <p class="quale">Secondo enigma</p>
  </header>

  <button id="apri" onclick="mostra()">Mostra il suggerimento</button>
  <div id="aiuto" hidden>
    <p>Torna indietro nel libro, sala per sala, e cerca gli oggetti che avevano una targhetta con il nome.</p>
  </div>

  <p class="chiusura">Escape Room — La Fabbrica di Babbo Natale<br>La soluzione completa è in fondo al libro.</p>
</main>
<script>
function mostra(){
  document.getElementById('apri').hidden = true;
  document.getElementById('aiuto').hidden = false;
}
</script>
</body>
</html>
