<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La canzone della Fabbrica</title>
<style>
  :root{
    --notte:#15243a; --notte-cupa:#101b2c;
    --ottone:#d2a444; --ottone-scuro:#8d6a22;
    --carta:#f4ead6; --carta-tenue:#cdbfa6;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  body{
    margin:0;
    background:var(--notte);
    background-image:radial-gradient(ellipse at 50% -10%, #1e3251 0%, var(--notte) 55%, var(--notte-cupa) 100%);
    color:var(--carta);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  main{max-width:32rem;margin:0 auto;padding:2.5rem 1.25rem 4rem;text-align:center}
  .appendino{
    width:1px;height:1.6rem;margin:0 auto;
    background:linear-gradient(to bottom, rgba(244,234,214,.05), rgba(244,234,214,.35));
  }
  .targhetta{
    display:inline-block;
    padding:.5rem 1.15rem .6rem;
    border-radius:.3rem;
    background:linear-gradient(160deg,#e8c169 0%,var(--ottone) 45%,#a97f2c 100%);
    color:#3a2a08;
    font-size:1.5rem;font-weight:700;
    box-shadow:0 2px 5px rgba(0,0,0,.45);
    position:relative;
  }
  .targhetta::before{
    content:"";position:absolute;top:.26rem;left:50%;
    transform:translateX(-50%);
    width:.3rem;height:.3rem;border-radius:50%;
    background:#3a2a08;opacity:.5;
  }
  .sala{margin:1.4rem 0 .35rem;color:var(--carta-tenue);font-size:.95rem}
  h1{font-size:1.45rem;font-weight:600;line-height:1.3;margin:0 0 2rem}
  .testo{max-width:26rem;margin:0 auto 2rem;text-align:left}
  audio{width:100%;max-width:26rem;margin-bottom:2rem}
  .chiusura{
    margin-top:2rem;padding-top:1.25rem;
    border-top:1px solid rgba(244,234,214,.15);
    font-size:.9rem;color:var(--carta-tenue);
  }
  #coriandoli{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    pointer-events:none;
    z-index:9999;
  }
</style>
</head>
<body>
<main>
  <div class="appendino"></div>
  <span class="targhetta">★</span>
  <p class="sala">Il gran finale</p>
  <h1>Hai salvato il Natale</h1>

  <p class="testo">La Scintilla è tornata ad ardere e il Natale è salvo. Gli elfi hanno preparato una cosa per te: alza il volume.</p>

  <audio id="canzone" controls preload="metadata" src="canzone.mp3">
    Il tuo browser non riesce a riprodurre l'audio.
  </audio>

  <p class="chiusura">Escape Room — La Fabbrica di Babbo Natale</p>
</main>

<canvas id="coriandoli" aria-hidden="true"></canvas>

<script>
(function(){
  var audio = document.getElementById('canzone');
  var canvas = document.getElementById('coriandoli');
  var ctx = canvas.getContext('2d');
  var pezzi = [];
  var animando = false;
  var fineFlusso = 0;               // istante in cui smette di piovere
  var ridotto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COLORI = ['#d2a444','#e8c169','#b8452f','#2e8b57','#f4ead6','#c0392b'];

  function dimensiona(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  dimensiona();
  window.addEventListener('resize', dimensiona);

  function nuovoPezzo(){
    return {
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 40,
      vx: (Math.random() - 0.5) * 1.2,
      vy: 1.5 + Math.random() * 2.5,
      ondeggio: Math.random() * Math.PI * 2,
      ampiezza: 0.5 + Math.random() * 1.2,
      w: 6 + Math.random() * 6,
      h: 9 + Math.random() * 7,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.25,
      col: COLORI[(Math.random() * COLORI.length) | 0]
    };
  }

  function avvia(){
    if (ridotto) return;
    fineFlusso = performance.now() + 8000;   // pioggia per 8 secondi
    if (!animando){ animando = true; requestAnimationFrame(ciclo); }
  }

  function ciclo(now){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // finché siamo nella finestra di flusso, aggiungi nuovi coriandoli a ogni frame
    if (now < fineFlusso){
      for (var k = 0; k < 5; k++){ pezzi.push(nuovoPezzo()); }
    }

    for (var i = pezzi.length - 1; i >= 0; i--){
      var p = pezzi[i];
      p.ondeggio += 0.05;
      p.x += p.vx + Math.sin(p.ondeggio) * p.ampiezza;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y > canvas.height + 30){ pezzi.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }

    if (now < fineFlusso || pezzi.length){
      requestAnimationFrame(ciclo);
    } else {
      animando = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  audio.addEventListener('play', avvia);
})();
</script>
</body>
</html>
